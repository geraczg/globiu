<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Catálogo visual de arreglos con globos de Globiu para graduaciones, cumpleaños y celebraciones especiales.">
  <meta name="theme-color" content="#050505">
  <title>Catálogo de globos | Globiu</title>
  <link rel="icon" href="assets/favicon.svg?v=1" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=63">
  <script src="catalogo.js?v=3" defer></script>
</head>
<body class="catalog-page">
  <a class="skip-link" href="#catalogo">Saltar al catálogo</a>

  <header class="catalog-header">
    <nav class="catalog-nav" aria-label="Navegación del catálogo">
      <a class="brand brand--catalog" href="index.html#inicio" aria-label="Globiu, volver al inicio">
        <span class="brand__name" aria-hidden="true">
          <span>G</span><span>L</span><span>O</span><span class="brand__balloon-letter">B</span><span>I</span><span>U</span>
        </span>
        <span class="brand__tagline">Balloons &amp; More</span>
      </a>
      <a class="catalog-back" href="index.html#galeria">
        <span aria-hidden="true">←</span>
        Regresar
      </a>
    </nav>
  </header>

  <main class="catalog-main" id="catalogo">
    <section class="catalog-section" aria-labelledby="catalog-title">
      <h1 class="sr-only" id="catalog-title">Catálogo de globos</h1>
      <div class="catalog-grid">
        <figure class="catalog-card">
          <img src="assets/graduados-princesa.png" alt="Globo transparente de graduación en tonos rosa y negro" loading="eager">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card">
          <img src="assets/graduados-colorido.png" alt="Globo transparente de graduación con diseño de colores" loading="eager">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card">
          <img src="assets/graduados-azul-plata.png" alt="Arreglo de graduación con globos azul y plata" loading="eager">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card">
          <img src="assets/graduados-dorado.png" alt="Arreglo de graduación con globo transparente y estrella dorada" loading="eager">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card">
          <img src="assets/globos-dia-padre-snacks.png" alt="Globo personalizado del Día del Padre acompañado de una caja con bebidas y botanas" loading="lazy">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card">
          <img src="assets/globos-dia-padre-heroe.png" alt="Arreglo azul del Día del Padre con globo transparente y globos metálicos" loading="lazy">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card">
          <img src="assets/globos-dia-padre-personalizado.png" alt="Globo burbuja azul y amarillo personalizado para el Día del Padre" loading="lazy">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card">
          <img src="assets/globos-dia-padre-estrellas.png" alt="Arreglo del Día del Padre con globo negro y estrellas metálicas azules" loading="lazy">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card catalog-card--transparent catalog-card--captioned catalog-card--captioned-blue">
          <img src="assets/catalogo-graduacion-princesa-transparente.png" alt="Globo transparente de graduación en tonos rosa y negro con mensaje Felicidades Princesa" loading="lazy">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card catalog-card--transparent catalog-card--captioned catalog-card--captioned-blue">
          <img src="assets/catalogo-graduacion-colorido-transparente.png" alt="Globo transparente de graduación con pinceladas de colores y mensaje Congrats Grad" loading="lazy">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card catalog-card--transparent catalog-card--captioned catalog-card--captioned-blue">
          <img src="assets/catalogo-graduacion-azul-transparente.png" alt="Arreglo de graduación con globo transparente y estrellas metálicas azules y plateadas" loading="lazy">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card catalog-card--transparent catalog-card--captioned catalog-card--captioned-blue">
          <img src="assets/catalogo-graduacion-dorado-transparente.png" alt="Arreglo de graduación con globo transparente, estrellas doradas y globo metálico dorado" loading="lazy">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card catalog-card--transparent catalog-card--captioned">
          <img src="assets/catalogo-padre-snacks-transparente.png" alt="Globo personalizado del Día del Padre acompañado de una caja con bebidas y botanas" loading="lazy">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card catalog-card--transparent catalog-card--captioned">
          <img src="assets/catalogo-padre-heroe-transparente.png" alt="Arreglo azul del Día del Padre con globo transparente y globos metálicos" loading="lazy">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card catalog-card--transparent catalog-card--captioned">
          <img src="assets/catalogo-padre-personalizado-transparente.png" alt="Globo burbuja azul y amarillo personalizado para el Día del Padre" loading="lazy">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
        <figure class="catalog-card catalog-card--transparent catalog-card--captioned">
          <img src="assets/catalogo-padre-estrellas-transparente.png" alt="Arreglo del Día del Padre con globo negro y estrellas metálicas azules" loading="lazy">
          <figcaption>Lorem ipsum dolor sit amet.</figcaption>
        </figure>
      </div>

      <div class="catalog-repeat-carousel" data-catalog-carousel aria-label="Carrusel de arreglos destacados">
        <h2 class="sr-only">Arreglos destacados</h2>
        <div class="catalog-repeat-carousel__viewport">
          <div class="catalog-repeat-carousel__track" data-catalog-track tabindex="0">
            <figure class="catalog-repeat-carousel__slide">
              <img src="assets/graduados-princesa.png" alt="Globo transparente de graduación en tonos rosa y negro" loading="lazy">
            </figure>
            <figure class="catalog-repeat-carousel__slide">
              <img src="assets/graduados-colorido.png" alt="Globo transparente de graduación con diseño de colores" loading="lazy">
            </figure>
            <figure class="catalog-repeat-carousel__slide">
              <img src="assets/graduados-azul-plata.png" alt="Arreglo de graduación con globos azul y plata" loading="lazy">
            </figure>
            <figure class="catalog-repeat-carousel__slide">
              <img src="assets/graduados-dorado.png" alt="Arreglo de graduación con globo transparente y estrella dorada" loading="lazy">
            </figure>
            <figure class="catalog-repeat-carousel__slide">
              <img src="assets/carrusel-graduacion-azul-suerte.png" alt="Arreglo azul de graduación con globo personalizado y estrellas metálicas" loading="lazy">
            </figure>
            <figure class="catalog-repeat-carousel__slide">
              <img src="assets/carrusel-graduacion-azul-mama.png" alt="Arreglo azul de graduación con mensaje personalizado de mamá" loading="lazy">
            </figure>
          </div>
        </div>

        <div class="catalog-repeat-carousel__controls">
          <button type="button" data-catalog-previous aria-label="Ver imagen anterior">←</button>
          <button type="button" data-catalog-next aria-label="Ver imagen siguiente">→</button>
        </div>
      </div>
    </section>

  </main>

  <footer class="catalog-footer">
    <p>Globiu Balloons &amp; More</p>
    <a href="index.html#inicio">Volver al inicio</a>
  </footer>
</body>
</html>
